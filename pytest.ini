[pytest]
# Pytest configuration for DABS Automation System

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    performance: Performance and load tests
    slow: Tests that take longer to run
    audit: Tests related to audit trail functionality
    validation: Tests related to data validation
    export: Tests related to file export functionality

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Coverage options (if pytest-cov is installed)
# addopts = 
#     -v
#     --tb=short
#     --strict-markers
#     --disable-warnings
#     --color=yes
#     --durations=10
#     --cov=src
#     --cov-report=html
#     --cov-report=term-missing
#     --cov-fail-under=90

# Async support
asyncio_mode = auto

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:openpyxl.*
