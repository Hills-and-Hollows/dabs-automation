# Spequa Project Configuration
# Generated by: spequafy init
# Documentation: https://github.com/EQUAStart/spequa
#
# This file configures spequa commands for your project.
# All keys have sensible defaults — only override what you need.

# Primary language ecosystem (auto-detected from marker files)
# Valid values: python, nodejs, go, rust, java, other
primary: other

# Full command to run tests (used by /spequa.16-close and /spequa.9-test)
test_command: "echo 'No test runner configured'"

# Package manager identifier (used for environment detection)
package_manager: "unknown"

# Prefix added before NNN-feature branch names (e.g., "feat/")
# Leave empty for standard NNN-feature naming
branch_prefix: ""

# Project root relative to repo root (for monorepos)
# Set to subdirectory path, e.g., "packages/api"
project_root: "."

# Directory where spec artifacts are stored (relative to repo root)
spec_dir: "specs"

# Override specific pipeline scripts (optional)
# Keys: create_feature, check_prerequisites, close_spec,
#        run_baseline_tests, run_closure_checks
# Values: path to custom script relative to repo root
# custom_scripts:
#   run_baseline_tests: "scripts/my-test-runner.sh"

# Project-specific keys (not validated against schema)
# Use for extensions and custom workflows
# custom:
#   my_key: my_value
