version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Denver"
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Denver"
    labels:
      - dependencies
      - ci

  - package-ecosystem: npm
    directory: "/archon-mcp/archon-ui-main"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Denver"
    labels:
      - dependencies
      - frontend
