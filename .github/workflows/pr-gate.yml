name: PR Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  format:
    name: black (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install black
        run: pip install "black==23.11.0"
      - name: Check formatting
        run: black --check --diff src tests
        continue-on-error: true

  lint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pylint + project requirements
        run: |
          pip install --upgrade pip
          pip install "pylint==3.0.2"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run pylint
        run: pylint src --exit-zero --output-format=colorized

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install mypy + project requirements
        run: |
          pip install --upgrade pip
          pip install "mypy==1.7.1"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run mypy
        run: mypy src --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  pytest:
    name: pytest (unit + non-integration)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install requirements
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_automation.txt ]; then pip install -r requirements_automation.txt; fi
          if [ -f requirements_dabs_orders.txt ]; then pip install -r requirements_dabs_orders.txt; fi
      - name: Run pytest (exclude integration + performance + slow markers)
        run: |
          pytest \
            -m "not integration and not performance and not slow" \
            --tb=short \
            --disable-warnings \
            -v
        continue-on-error: true

  docker-build:
    name: Docker build (Dockerfile.railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.railway
          push: false
          tags: dabs-automation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
